brief = "Triage strings and library calls first, then a static+dynamic path to recover the constraint or secret."

playbook = """
REV: most reversing challenges are far easier than the disassembly makes them
look. Exhaust the cheap wins before reaching for symbolic execution.

1. Triage: `file`, `checksec`, and a `strings` pass (both ASCII and wide/UTF-16
   with `strings -e l`). A plaintext flag or password in the strings ends the
   challenge on step one, and it happens often.
2. Watch it run. `ltrace` catches the classic case — a single `strcmp`/`strncmp`
   of your input against the secret, printed right there in the trace. `strace`
   shows the syscall shape (does it read a file, open /dev/, check ptrace?).
3. If it is UPX-packed (`file`/`strings` will say), `upx -d` and re-triage from
   step 1 on the unpacked binary rather than fighting the packed one.
4. Read the check statically in rizin/radare2: disassemble main and the function
   that decides correct-vs-wrong. Most challenges are one of a few shapes — a
   direct comparison, an XOR/rotate of the input against a constant, a custom
   hash, or a byte-by-byte arithmetic constraint.
5. Match the shape to the tool. A constant transform means write the inverse and
   decode. A wall of per-byte arithmetic checks means z3: model each flag byte as
   a BitVec, add the decompiled constraints, solve. A branchy input-driven maze
   means angr: `explore(find=..., avoid=...)` on the "correct"/"wrong" strings.

An "incorrect"/"wrong" print from re-running the binary with another guess is
not progress. A recovered constraint, a decoded constant, or a satisfying model
is. Prefer reading the check to brute-forcing inputs against it.
"""

required_tools = ["file", "checksec", "rizin", "radare2", "ltrace", "strace", "upx", "angr", "z3-solver", "python3"]

signal_low = ['command not found', 'No such file', '^$', 'wrong', 'incorrect']
signal_high = ['flag\{', 'FLAG\{', 'picoCTF\{', 'strcmp', 'correct']

step_limit = 100
network = "bridge"

[tactic_families]
triage = '^file |^strings |ltrace|strace|checksec'
static = 'rizin|radare2|r2 |objdump|pdf @|afl|iz'
symbolic = 'angr|simgr|explore'
constraint = 'z3|Solver\(|BitVec|claripy'
unpack = 'upx|unpack|packed'
decompile = 'ghidra|decompil|jadx|monodis|uncompyle|pycdc'

[budgets]
per_hypothesis = 2
per_family = 4
# D8: forced strategy shift after N no-progress steps or M consecutive errors.
# Unmeasured starting values (D16) — `runectl bench` is what tunes them.
no_progress_shift = 3
consecutive_error_shift = 3
