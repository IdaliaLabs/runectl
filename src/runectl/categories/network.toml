brief = "Protocol hierarchy first, follow the key streams/sessions, then extract objects, credentials, and flag artifacts."

playbook = """
NETWORK: a pcap is a haystack — read its shape before searching it. Most of
these challenges default to `--network none` in practice (a captured file, not a
live target), but the default here is `bridge` so a challenge that does give a
host/port works without a flag.

1. Triage the capture: `capinfos` for size/duration/packet count, then
   `tshark -qz io,phs` for the protocol hierarchy. That one command tells you
   whether to think HTTP, FTP, DNS, SMB, or TLS — do not start filtering
   blindly. A quick `strings | grep` for a flag-shaped token is a cheap first pass.
2. Follow the conversations that carry payload. `tshark -qz conv,tcp` ranks the
   streams by bytes; the biggest are usually where the data is. Follow them
   (`follow,tcp,ascii,N`) rather than scrolling packet-by-packet.
3. Extract by protocol once you know which one matters:
     HTTP  -> --export-objects http (files, uploads, downloads)
     FTP   -> the USER/PASS commands, then reassemble the ftp-data stream
     DNS   -> query names; base64/hex in subdomains is exfiltration
     SMB/TFTP -> --export-objects
4. Hunt credentials directly: cleartext USER/PASS, HTTP Authorization headers,
   telnet data. For 802.11 captures, `aircrack-ng` against a wordlist if there
   is a handshake.
5. Carve embedded files from the payload (`binwalk`/`foremost`) when a stream
   clearly contains a transferred file the export step missed.

Re-running the same follow on the same empty stream is not progress. A new
credential, an exported object, or a decoded exfil channel is. Let the protocol
hierarchy, not guesswork, pick the next filter.
"""

required_tools = ["tshark", "capinfos", "nmap", "aircrack-ng", "binwalk", "foremost"]

signal_low = ['not found', 'No such file', '^$', '0 packets', 'malformed']
signal_high = ['flag\{', 'FLAG\{', 'USER ', 'PASS ', 'Authorization']

step_limit = 60
network = "bridge"

[tactic_families]
triage = 'capinfos|io,phs|conv,tcp'
extract = 'export-objects|--export|foremost|binwalk'
follow = 'follow,tcp|follow,udp|follow.*ascii'
creds = 'USER|PASS|authorization|password|telnet'
carve = 'binwalk -e|binwalk --run|foremost|dd '
wifi = 'aircrack|wpa|wep|handshake'
live = 'nmap|nc |ncat|://'

[budgets]
per_hypothesis = 2
per_family = 4
# D8: forced strategy shift after N no-progress steps or M consecutive errors.
# Unmeasured starting values (D16) — `runectl bench` is what tunes them.
no_progress_shift = 3
consecutive_error_shift = 3
