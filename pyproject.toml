[project]
name = "runectl"
version = "0.1.0"
description = "Agentic CTF solver — CLI (Idalia Labs)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "docker>=7",
  "anthropic>=0.34",
  "openai>=1.40",
  "google-genai>=0.3",
  "keyring>=25",
  "rich>=13",
]

[project.scripts]
runectl = "runectl.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runectl"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-docker",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/runectl"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# Vendored/authored challenge inputs under bench/practice/*/files are data, not
# project source — they are byte-for-byte upstream (or a fixture) and must not be
# reformatted to our style.
extend-exclude = ["bench/practice/*/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's argument-default pattern (`x: T = typer.Option(...)`) is the documented API.
"src/runectl/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
